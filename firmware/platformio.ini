; GGreg20_V3 -> I2C translator (RadSens compatible), bare-metal firmware
;
;   build :  pio run
;   flash :  pio run -t upload --upload-port COMx
;
; Programming uses a plain USB-serial adapter as UPDI programmer ("SerialUPDI"):
;   adapter TX --[1k..4k7]--+-- UPDI pin (J2)
;   adapter RX -------------+
;   adapter GND -- GND, 3.3 V -- VCC (or power the board from the node)
; Factory fuses are fine, nothing needs to be changed.

[platformio]
default_envs = attiny1614

[env]
platform = atmelmegaavr
board_build.f_cpu = 5000000L
build_unflags = -std=gnu11
build_flags = -std=gnu11 -Os -Wall -Wextra
upload_protocol = serialupdi
upload_speed = 115200

[env:attiny1614]
board = ATtiny1614
